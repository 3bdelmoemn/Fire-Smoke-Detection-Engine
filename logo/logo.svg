<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="110" r="106" fill="url(#bg)" stroke="url(#ring)" stroke-width="3"/>

  <!-- scan / radar ring accents -->
  <circle cx="110" cy="110" r="88" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 6"/>

  <!-- corner detection brackets (like a bounding box) -->
  <g stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M46 56 V42 H60"/>
    <path d="M174 56 V42 H160"/>
    <path d="M46 164 V178 H60"/>
    <path d="M174 164 V178 H160"/>
  </g>

  <!-- flame -->
  <path d="M110 46
           C 92 72, 78 88, 78 116
           C 78 142, 93 158, 110 158
           C 127 158, 142 142, 142 116
           C 142 100, 134 90, 128 82
           C 128 96, 120 104, 112 100
           C 118 88, 112 66, 96 54
           C 100 66, 96 78, 88 84
           C 92 66, 100 54, 110 46 Z"
        fill="url(#flame)"/>

  <!-- inner glow ember -->
  <ellipse cx="110" cy="128" rx="14" ry="18" fill="#fde68a" opacity="0.85"/>

  <!-- small AI/eye dot to suggest "detection" -->
  <circle cx="110" cy="128" r="5" fill="#7c2d12"/>
</svg>
